<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
<title id="title">Estabilizar os Cem-Quilos</title><desc id="desc">Pôster infantil com seis passos ilustrados para estabilizar o controle lateral.</desc>
<defs><linearGradient id="paper" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e9f8f7"/></linearGradient><linearGradient id="cyan"><stop stop-color="#0789b2"/><stop offset="1" stop-color="#066e96"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17426b" flood-opacity=".22"/></filter>
<symbol id="side" viewBox="0 0 220 170"><ellipse cx="108" cy="151" rx="99" ry="14" fill="#7ac9c8" opacity=".32"/><g transform="translate(18 77) rotate(-4 92 42)"><circle cx="48" cy="31" r="21" fill="#efad6b" stroke="#49301e" stroke-width="4"/><path d="M25 28Q31 1 61 8q17 7 10 29-14-14-23-14-8 8-23 5" fill="#4b2915"/><path d="M39 35h3m12 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M29 51q45-9 76 20l26 49-112 2z" fill="#fafaf7" stroke="#173f62" stroke-width="4"/><path d="m67 78 6 43" stroke="#26976b" stroke-width="9"/><path d="M31 72 4 113m91-33 44 31" stroke="#fafaf7" stroke-width="17" stroke-linecap="round"/></g><g transform="translate(87 26) rotate(8 58 61)"><circle cx="53" cy="29" r="21" fill="#efad6b" stroke="#49301e" stroke-width="4"/><path d="M31 27Q35 0 66 6q16 8 10 29-12-15-23-14-8 9-22 6" fill="#4b2915"/><path d="M43 34h3m12 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M28 51q33-11 60 11l15 62-91 5z" fill="#126daf" stroke="#173f62" stroke-width="4"/><path d="M32 55 58 83 84 60" fill="none" stroke="#e2eeea" stroke-width="4"/><path d="M29 68 1 106m80-39 40 38" stroke="#126daf" stroke-width="17" stroke-linecap="round"/><path d="M24 119 6 149m82-26 25 26" stroke="#173f62" stroke-width="17" stroke-linecap="round"/></g></symbol></defs>
<rect width="760" height="1080" fill="url(#paper)"/><g font-family="'Baloo 2',sans-serif"><path d="M110 17Q380-4 650 17l-12 57H122z" fill="url(#cyan)" filter="url(#shadow)"/><path d="m122 30-49 7 30 23-23 22 50-8zm516 0 49 7-30 23 23 22-50-8z" fill="#075c7e"/><text x="380" y="56" text-anchor="middle" fill="white" font-size="27" font-weight="800">CAPÍTULO 2 — PASSAGENS E ESTABILIZAÇÃO</text><text x="380" y="131" text-anchor="middle" fill="#087fa8" font-size="58" font-weight="900">ESTABILIZAR OS CEM-QUILOS</text><text x="380" y="169" text-anchor="middle" fill="#17253d" font-size="23" font-weight="700">Passou? Agora segure a posição antes de mudar de novo.</text>
<g transform="translate(31 198)"><rect width="698" height="105" rx="20" fill="#eefaff" stroke="#0b95ba" stroke-width="4"/><circle cx="54" cy="52" r="30" fill="#0a83a9"/><path d="M38 66q17-33 33 0M54 28v48" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/><text x="100" y="43" fill="#087fa8" font-size="27" font-weight="800">CONTROLE TAMBÉM É TÉCNICA!</text><text x="100" y="74" fill="#17253d" font-size="18">Distribua o peso, respire e respeite o colega o tempo todo.</text></g>
<g transform="translate(18 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">1</text><text x="64" y="40" fill="#087fa8" font-size="20" font-weight="800">CHEGAR AO LADO</text><use href="#side" x="7" y="53" width="217" height="172"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Depois da passagem,</tspan><tspan x="116" dy="21">chegue ao lado.</tspan></text></g>
<g transform="translate(264 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">2</text><text x="64" y="40" fill="#087fa8" font-size="20" font-weight="800">ENCOSTAR PEITO</text><use href="#side" x="7" y="53" width="217" height="172" transform="translate(0 8)"/><path d="M124 104v42m-10-11 10 11 10-11" fill="none" stroke="#087fa8" stroke-width="6"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Aproxime o peito</tspan><tspan x="116" dy="21">sem deixar espaço.</tspan></text></g>
<g transform="translate(510 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">3</text><text x="64" y="35" fill="#087fa8" font-size="18" font-weight="800">CABEÇA</text><text x="64" y="55" fill="#087fa8" font-size="18" font-weight="800">E OMBRO</text><use href="#side" x="7" y="58" width="217" height="168"/><circle cx="75" cy="145" r="22" fill="none" stroke="#f5b301" stroke-width="5" stroke-dasharray="6 5"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Organize os braços</tspan><tspan x="116" dy="21">com muito cuidado.</tspan></text></g>
<g transform="translate(18 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">4</text><text x="64" y="40" fill="#087fa8" font-size="22" font-weight="800">BASE FIRME</text><use href="#side" x="7" y="53" width="217" height="172" transform="scale(1.04) translate(-4 -3)"/><path d="M34 202h48m67 0h49" stroke="#087fa8" stroke-width="6" stroke-linecap="round"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Joelhos abertos e</tspan><tspan x="116" dy="21">peso equilibrado.</tspan></text></g>
<g transform="translate(264 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">5</text><text x="64" y="40" fill="#087fa8" font-size="19" font-weight="800">BLOQUEAR QUADRIL</text><use href="#side" x="7" y="53" width="217" height="172"/><path d="M62 182h45" stroke="#e0592a" stroke-width="7" stroke-linecap="round"/><path d="m94 170 14 12-14 12" fill="none" stroke="#e0592a" stroke-width="6"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Não deixe o quadril</tspan><tspan x="116" dy="21">escapar para a guarda.</tspan></text></g>
<g transform="translate(510 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08b7cb" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087fa8"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">6</text><text x="64" y="40" fill="#087fa8" font-size="20" font-weight="800">FICAR ESTÁVEL</text><use href="#side" x="7" y="53" width="217" height="172"/><path d="M174 92l6 12 14 2-10 10 3 14-13-7-12 7 2-14-10-10 14-2z" fill="#f5b301"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#eefafa"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Respire e só depois</tspan><tspan x="116" dy="21">pense no próximo passo.</tspan></text></g>
<g transform="translate(18 956)"><rect width="724" height="77" rx="18" fill="url(#cyan)"/><path d="M40 18 64 8l24 10v17q0 20-24 31Q40 55 40 35z" fill="none" stroke="white" stroke-width="5"/><text x="106" y="49" fill="white" font-size="25" font-weight="800">REGRA DO JIU-JITSU</text><text x="387" y="49" fill="white" font-size="19">Passar é importante. Estabilizar também.</text><text x="681" y="51" fill="#f5c842" font-size="39">★</text></g><text x="380" y="1062" text-anchor="middle" fill="#087fa8" font-size="18" font-weight="700">PACIÊNCIA HOJE, GUERREIROS AMANHÃ!</text></g></svg>