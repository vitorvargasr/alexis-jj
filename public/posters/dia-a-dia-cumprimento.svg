<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title-2 desc-2">
  <title id="title-2">O Cumprimento e o Amigo Léo</title>
  <desc id="desc-2">Álexis e seu amigo de treino Léo se cumprimentam com respeito no tatame sob o olhar do pai Vítor.</desc>
  <defs>
    <linearGradient id="bg2" x2="0" y2="1"><stop stop-color="#fffef9"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="header2" x2="1" y2="1"><stop stop-color="#0284c7"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#075985" flood-opacity=".2"/></filter>
  </defs>
  <rect width="760" height="1080" fill="url(#bg2)"/>
  
  <!-- Moldura de Quadrinho -->
  <rect x="24" y="24" width="712" height="1032" rx="20" fill="none" stroke="#1e3a5f" stroke-width="8"/>
  <rect x="36" y="36" width="688" height="1008" rx="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Cabeçalho Comic -->
  <path d="M70 54 Q380 32 690 54 L676 126 H84 Z" fill="url(#header2)" filter="url(#shadow2)"/>
  <text x="380" y="104" text-anchor="middle" fill="#ffffff" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="34" letter-spacing="1">EDIÇÃO #1 · AMIZADE E RESPEITO</text>

  <!-- Balão de Narração Estilo gibi (topo) -->
  <g transform="translate(60 148)">
    <rect width="640" height="92" rx="16" fill="#fef08a" stroke="#1e3a5f" stroke-width="4"/>
    <text x="30" y="40" fill="#1e3a5f" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="22">NO TATAME COM O AMIGO DE TREINO...</text>
    <text x="30" y="70" fill="#334155" font-family="'Baloo 2', sans-serif" font-weight="600" font-size="20">Léo já está pronto! O pai ensina: "Antes de rolar, a gente sempre cumprimenta com OSS!".</text>
  </g>

  <!-- Cena Central Ilustrada -->
  <g transform="translate(60 260)">
    <!-- Fundo do tatame azul royal -->
    <rect width="640" height="500" rx="22" fill="#dbeafe" stroke="#1e3a5f" stroke-width="5"/>
    <path d="M0 370 Q320 340 640 370 L640 500 L0 500 Z" fill="#0284c7"/>
    <circle cx="320" cy="435" r="90" fill="#0369a1" opacity="0.5"/>

    <!-- Álexis (à esquerda, kimono branco, inclinando em reverência amigável) -->
    <g transform="translate(80 120)">
      <ellipse cx="80" cy="290" rx="50" ry="14" fill="#075985" opacity="0.4"/>
      <!-- Cabeça -->
      <circle cx="95" cy="75" r="40" fill="#fcd34d" stroke="#1e3a5f" stroke-width="5"/>
      <path d="M60 65 Q95 20 130 65 Q115 35 90 40 Q75 35 60 65" fill="#78350f"/>
      <ellipse cx="85" cy="78" rx="4" ry="5" fill="#1e3a5f"/>
      <ellipse cx="112" cy="78" rx="4" ry="5" fill="#1e3a5f"/>
      <path d="M88 94 Q98 104 108 94" stroke="#b91c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Tronco inclinado cumprimentando -->
      <path d="M55 120 L135 120 L155 260 L45 260 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="5"/>
      <rect x="45" y="195" width="105" height="18" rx="4" fill="#f8fafc" stroke="#1e3a5f" stroke-width="3"/>
      <!-- Braço estendido para toque de punho (fist bump) -->
      <path d="M125 150 Q180 160 215 170" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
      <path d="M125 150 Q180 160 215 170" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="218" cy="172" r="14" fill="#fcd34d" stroke="#1e3a5f" stroke-width="4"/>
    </g>

    <!-- Amigo de treino Léo (à direita, kimono azul, fazendo o fist bump) -->
    <g transform="translate(360 120)">
      <ellipse cx="120" cy="290" rx="50" ry="14" fill="#075985" opacity="0.4"/>
      <!-- Cabeça Léo -->
      <circle cx="105" cy="75" r="40" fill="#fed7aa" stroke="#1e3a5f" stroke-width="5"/>
      <path d="M70 65 Q105 18 140 65 Q120 30 90 35 Q75 38 70 65" fill="#1c1917"/>
      <ellipse cx="95" cy="78" rx="4" ry="5" fill="#1e3a5f"/>
      <ellipse cx="122" cy="78" rx="4" ry="5" fill="#1e3a5f"/>
      <path d="M98 94 Q108 104 118 94" stroke="#b91c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Tronco Léo (Kimono Royal Blue) -->
      <path d="M65 120 L145 120 L165 260 L55 260 Z" fill="#2563eb" stroke="#1e3a5f" stroke-width="5"/>
      <path d="M70 120 L105 180 L140 120" stroke="#f8fafc" stroke-width="4" fill="none"/>
      <rect x="55" y="195" width="105" height="18" rx="4" fill="#f8fafc" stroke="#1e3a5f" stroke-width="3"/>
      <!-- Braço do Léo estendido para o toque de punho -->
      <path d="M75 150 Q20 160 -15 170" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
      <path d="M75 150 Q20 160 -15 170" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="-18" cy="172" r="14" fill="#fed7aa" stroke="#1e3a5f" stroke-width="4"/>
    </g>

    <!-- Ponto do Toque de Punhos com faísca mágica estilo gibi -->
    <g transform="translate(300 290)">
      <polygon points="20,0 27,14 42,12 31,24 37,38 23,32 14,44 11,30 -3,28 8,17 -1,5 14,10" fill="#facc15" stroke="#1e3a5f" stroke-width="3"/>
      <text x="20" y="27" text-anchor="middle" fill="#1e3a5f" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="13">TOC!</text>
    </g>

    <!-- Pai Vítor ao fundo supervisionando sorridente -->
    <g transform="translate(255 18)">
      <circle cx="65" cy="50" r="30" fill="#f6c492" stroke="#1e3a5f" stroke-width="3"/>
      <path d="M38 42 Q65 15 92 42 Z" fill="#332211"/>
      <path d="M48 68 Q65 85 82 68" stroke="#332211" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="56" cy="50" r="3" fill="#1e3a5f"/>
      <circle cx="74" cy="50" r="3" fill="#1e3a5f"/>
      <path d="M30 85 L100 85 L115 140 L15 140 Z" fill="#1e3a5f" stroke="#0f172a" stroke-width="4"/>
      <rect x="35" y="118" width="60" height="12" fill="#000000"/>
    </g>
  </g>

  <!-- Balão de Fala Conjunta -->
  <g transform="translate(100 780)">
    <path d="M30 0 L490 0 C505 0 515 10 515 22 L515 96 C515 110 505 120 490 120 L270 120 L240 146 L250 120 L30 120 C15 120 5 110 5 22 C5 10 15 0 30 0 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="5"/>
    <text x="40" y="42" fill="#0284c7" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="22">ÁLEXIS E LÉO EM CORO:</text>
    <text x="40" y="74" fill="#1e3a5f" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="20">"Toca aqui! Bom treino, parceiro!"</text>
    <text x="40" y="102" fill="#64748b" font-family="'Baloo 2', sans-serif" font-weight="600" font-size="18">O papai sorri orgulhoso: "Assim nasce um verdadeiro campeão!"</text>
  </g>

  <!-- Rodapé tipo gibi -->
  <g transform="translate(60 946)">
    <rect width="640" height="74" rx="16" fill="#1e3a5f"/>
    <text x="320" y="46" text-anchor="middle" fill="#ffffff" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="20">QUADRO 2 · RESPEITO E CUMPLICIDADE ⭐</text>
  </g>
</svg>