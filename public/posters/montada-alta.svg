<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">Montada Alta</title><desc id="desc">Pôster infantil ilustrado com seis passos para sair da montada alta.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#f8f0dc"/></linearGradient>
    <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#0c8794"/><stop offset="1" stop-color="#056a79"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#153854" flood-opacity=".2"/></filter>
    <symbol id="pair" viewBox="0 0 220 170">
      <ellipse cx="112" cy="154" rx="92" ry="14" fill="#8ccfce" opacity=".3"/>
      <g transform="translate(26 62) rotate(-8 84 54)">
        <circle cx="62" cy="43" r="23" fill="#f2b06d" stroke="#49301e" stroke-width="4"/><path d="M40 36q21-31 43-4l-5 9q-7-12-14-15-7 9-24 10" fill="#4c2b16"/><path d="M54 44h3m13 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M58 55q7 5 14-1" fill="none" stroke="#a94d37" stroke-width="3"/>
        <path d="M42 66q40-17 69 19l-8 48-71-2z" fill="#fff" stroke="#17253d" stroke-width="4"/><path d="M42 74l37 31 31-20" fill="none" stroke="#dce8e7" stroke-width="6"/><path d="M76 101l-4 35" stroke="#26976b" stroke-width="9"/>
      </g>
      <g transform="translate(86 14)">
        <circle cx="52" cy="35" r="22" fill="#f1ad68" stroke="#49301e" stroke-width="4"/><path d="M29 31q4-29 35-24 20 6 14 29-12-17-20-16-10 13-29 11" fill="#4b2915"/><path d="M42 38h3m14 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M45 49q7 5 14 0" fill="none" stroke="#a94d37" stroke-width="3"/>
        <path d="M29 57q23-13 48 1l25 60-79 9z" fill="#116fb0" stroke="#153c63" stroke-width="4"/><path d="M37 62l27 29 13-33" fill="none" stroke="#dce8e7" stroke-width="4"/><path d="M27 76L2 121m73-45 35 40" stroke="#116fb0" stroke-width="17" stroke-linecap="round"/><path d="M25 118 9 146m85-22 18 27" stroke="#153c63" stroke-width="18" stroke-linecap="round"/>
      </g>
    </symbol>
  </defs>
  <rect width="760" height="1080" fill="url(#paper)"/>
  <path d="M90 18Q380-4 670 18l-15 58H105z" fill="url(#teal)" filter="url(#shadow)"/><path d="M105 31 64 36l29 25-24 20 43-4zM655 31l41 5-29 25 24 20-43-4z" fill="#075a69"/>
  <text x="380" y="58" text-anchor="middle" fill="white" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="27">CAPÍTULO 1 — SAIR DAS POSIÇÕES</text>
  <text x="380" y="143" text-anchor="middle" fill="#087c8c" font-family="'Baloo 2',sans-serif" font-weight="900" font-size="73">MONTADA ALTA</text>
  <text x="380" y="180" text-anchor="middle" fill="#17253d" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="24">Proteja os braços, faça espaço e volte a defender.</text>
  <g transform="translate(28 207)"><rect width="704" height="108" rx="20" fill="#eafafb" stroke="#0b9cab" stroke-width="4"/><circle cx="51" cy="52" r="28" fill="#0b93a1"/><path d="M51 36v42M32 54h38" stroke="white" stroke-width="9" stroke-linecap="round"/><text x="95" y="43" fill="#087c8c" font-family="'Baloo 2',sans-serif" font-size="27" font-weight="800">MISSÃO DE HOJE</text><text x="95" y="76" fill="#17253d" font-family="'Baloo 2',sans-serif" font-size="19">Reconheça a posição, feche os cotovelos e use o quadril.</text></g>
  <g font-family="'Baloo 2',sans-serif">
    <g transform="translate(18 337)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">1</text><text x="64" y="40" fill="#087c8c" font-size="23" font-weight="800">RECONHECER</text><use href="#pair" x="9" y="53" width="214" height="166"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Veja onde estão os braços</tspan><tspan x="116" dy="21">e mantenha a calma.</tspan></text></g>
    <g transform="translate(264 337)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">2</text><text x="64" y="40" fill="#087c8c" font-size="23" font-weight="800">PROTEGER</text><use href="#pair" x="10" y="53" width="214" height="166"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Cotovelos fechados</tspan><tspan x="116" dy="21">viram um escudo.</tspan></text></g>
    <g transform="translate(510 337)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">3</text><text x="64" y="40" fill="#087c8c" font-size="21" font-weight="800">CRIAR ESPAÇO</text><use href="#pair" x="10" y="53" width="214" height="166"/><path d="M47 152h34m-15-14 15 14-15 14m119-14h-34m15-14-15 14 15 14" fill="none" stroke="#0789b8" stroke-width="6"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Mãos no quadril e</tspan><tspan x="116" dy="21">empurre com cuidado.</tspan></text></g>
    <g transform="translate(18 644)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">4</text><text x="64" y="40" fill="#087c8c" font-size="23" font-weight="800">CAMARÃO</text><use href="#pair" x="7" y="53" width="214" height="166" transform="rotate(-6 116 136)"/><path d="M38 101q16-28 44-30" fill="none" stroke="#0789b8" stroke-width="6"/><path d="m74 60 10 11-15 4" fill="#0789b8"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Vire de lado e afaste</tspan><tspan x="116" dy="21">bem o quadril.</tspan></text></g>
    <g transform="translate(264 644)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">5</text><text x="64" y="40" fill="#087c8c" font-size="21" font-weight="800">JOELHO ENTRA</text><use href="#pair" x="8" y="53" width="214" height="166"/><path d="M83 184q32-19 43-49" fill="none" stroke="#0789b8" stroke-width="6"/><path d="m115 141 12-8 3 15" fill="#0789b8"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Coloque o joelho</tspan><tspan x="116" dy="21">entre os dois corpos.</tspan></text></g>
    <g transform="translate(510 644)"><rect width="232" height="292" rx="18" fill="#fff" stroke="#09a9b8" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087c8c"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">6</text><text x="64" y="40" fill="#087c8c" font-size="19" font-weight="800">GUARDA SEGURA</text><use href="#pair" x="9" y="53" width="214" height="166" transform="rotate(4 116 136)"/><rect x="8" y="218" width="216" height="65" rx="13" fill="#eafafb"/><text x="116" y="246" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Volte para a guarda</tspan><tspan x="116" dy="21">e continue defendendo.</tspan></text></g>
  </g>
  <g transform="translate(18 951)" font-family="'Baloo 2',sans-serif"><rect width="724" height="72" rx="18" fill="url(#teal)"/><path d="M42 17 65 8l23 9v17q0 19-23 30Q42 53 42 34z" fill="none" stroke="white" stroke-width="5"/><text x="108" y="46" fill="white" font-size="25" font-weight="800">REGRA DO JIU-JITSU</text><text x="390" y="46" fill="white" font-size="20">Braços seguros e quadril ativo.</text><text x="680" y="48" fill="#f5c842" font-size="38">★</text></g>
  <text x="380" y="1055" text-anchor="middle" fill="#087c8c" font-family="'Baloo 2',sans-serif" font-size="18" font-weight="700">PEQUENOS PASSOS, GRANDES CONQUISTAS!</text>
</svg>