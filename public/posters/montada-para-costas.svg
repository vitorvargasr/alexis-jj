<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
<title id="title">Da Montada para as Costas</title><desc id="desc">Pôster infantil ilustrado com seis passos para acompanhar o colega até o controle das costas.</desc>
<defs><linearGradient id="bg" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#eaf8f6"/></linearGradient><linearGradient id="blue"><stop stop-color="#087eb1"/><stop offset="1" stop-color="#065f8c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17426b" flood-opacity=".25"/></filter>
<symbol id="kids" viewBox="0 0 220 170"><ellipse cx="110" cy="153" rx="98" ry="13" fill="#7dc8c5" opacity=".35"/><g transform="translate(21 58)"><circle cx="48" cy="37" r="21" fill="#efad6b" stroke="#49301e" stroke-width="4"/><path d="M26 34Q32 5 63 14q15 9 9 29-12-16-23-15-7 8-23 6" fill="#4b2915"/><path d="M39 41h3m12 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M31 59q35-12 58 19l19 50-85 3z" fill="#fff" stroke="#173f62" stroke-width="4"/><path d="m61 89 1 43" stroke="#26976b" stroke-width="9"/><path d="M25 83 2 124m78-36 34 32" stroke="#f7f7f4" stroke-width="17" stroke-linecap="round"/></g><g transform="translate(87 18)"><circle cx="55" cy="33" r="22" fill="#efad6b" stroke="#49301e" stroke-width="4"/><path d="M32 31Q36 2 69 10q16 9 9 28-12-15-23-15-8 9-23 8" fill="#4b2915"/><path d="M45 38h3m13 0h3" stroke="#17253d" stroke-width="4" stroke-linecap="round"/><path d="M35 56q28-12 52 8l15 58-78 7z" fill="#126daf" stroke="#173f62" stroke-width="4"/><path d="M36 61 60 88 85 62" fill="none" stroke="#dfecea" stroke-width="4"/><path d="M32 72 7 109m75-38 32 35" stroke="#126daf" stroke-width="17" stroke-linecap="round"/><path d="M28 118 10 148m81-25 22 27" stroke="#173f62" stroke-width="17" stroke-linecap="round"/></g></symbol></defs>
<rect width="760" height="1080" fill="url(#bg)"/><g font-family="'Baloo 2',sans-serif"><path d="M108 17Q380-4 652 17l-12 56H120z" fill="url(#blue)" filter="url(#s)"/><path d="m120 30-49 7 30 23-23 22 50-8zm520 0 49 7-30 23 23 22-50-8z" fill="#064f79"/><text x="380" y="56" text-anchor="middle" fill="white" font-weight="800" font-size="27">CAPÍTULO 3 — CONTROLE DAS COSTAS</text><text x="380" y="129" text-anchor="middle" fill="#087aad" font-weight="900" font-size="51">DA MONTADA PARA AS COSTAS</text><text x="380" y="168" text-anchor="middle" fill="#17253d" font-weight="700" font-size="23">Acompanhe o giro e organize um controle seguro.</text>
<g transform="translate(31 198)"><rect width="698" height="105" rx="20" fill="#eefaff" stroke="#0b91bd" stroke-width="4"/><circle cx="54" cy="52" r="30" fill="#0b84b0"/><path d="M39 56q15-24 30 0M54 31v49" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/><text x="99" y="43" fill="#087aad" font-weight="800" font-size="27">MOVIMENTO COM CONTROLE</text><text x="99" y="74" fill="#17253d" font-size="18">Conexão no tronco primeiro. Ganchos depois. Sem puxar o pescoço.</text></g>
<g transform="translate(18 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">1</text><text x="65" y="40" fill="#087aad" font-size="23" font-weight="800">MONTADA</text><use href="#kids" x="7" y="53" width="217" height="172"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Postura equilibrada,</tspan><tspan x="116" dy="21">joelhos firmes.</tspan></text></g>
<g transform="translate(264 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">2</text><text x="65" y="40" fill="#087aad" font-size="21" font-weight="800">O COLEGA GIRA</text><use href="#kids" x="8" y="53" width="216" height="172" transform="rotate(-5 116 139)"/><path d="M54 92q28-30 58-18" fill="none" stroke="#087aad" stroke-width="6"/><path d="m103 64 13 12-17 5" fill="#087aad"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Quando ele virar,</tspan><tspan x="116" dy="21">fique bem pertinho.</tspan></text></g>
<g transform="translate(510 324)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">3</text><text x="65" y="40" fill="#087aad" font-size="22" font-weight="800">ACOMPANHAR</text><use href="#kids" x="8" y="53" width="216" height="172" transform="rotate(7 116 139)"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Peito conectado e</tspan><tspan x="116" dy="21">braço como um cinto.</tspan></text></g>
<g transform="translate(18 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">4</text><text x="65" y="40" fill="#087aad" font-size="21" font-weight="800">1º GANCHO</text><use href="#kids" x="8" y="53" width="216" height="172" transform="rotate(-8 116 139)"/><path d="M172 165q22 17 1 35" fill="none" stroke="#087aad" stroke-width="6"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Sente atrás e coloque</tspan><tspan x="116" dy="21">um gancho com a perna.</tspan></text></g>
<g transform="translate(264 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">5</text><text x="65" y="40" fill="#087aad" font-size="20" font-weight="800">2º GANCHO</text><use href="#kids" x="8" y="53" width="216" height="172" transform="rotate(5 116 139)"/><path d="M46 173q-17 18 2 33" fill="none" stroke="#087aad" stroke-width="6"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Organize o outro lado</tspan><tspan x="116" dy="21">e complete o controle.</tspan></text></g>
<g transform="translate(510 639)"><rect width="232" height="300" rx="18" fill="white" stroke="#08aeda" stroke-width="4"/><circle cx="31" cy="32" r="23" fill="#087aad"/><text x="31" y="41" text-anchor="middle" fill="white" font-size="28" font-weight="800">6</text><text x="65" y="40" fill="#087aad" font-size="18" font-weight="800">COSTAS SEGURAS</text><use href="#kids" x="8" y="53" width="216" height="172"/><path d="M81 123q35 29 72 0" fill="none" stroke="#f5b301" stroke-width="5" stroke-dasharray="7 5"/><rect x="8" y="224" width="216" height="67" rx="13" fill="#edfaff"/><text x="116" y="252" text-anchor="middle" fill="#17253d" font-size="16"><tspan x="116">Controle firme,</tspan><tspan x="116" dy="21">calmo e sem apertar.</tspan></text></g>
<g transform="translate(18 956)"><rect width="724" height="77" rx="18" fill="url(#blue)"/><path d="M40 18 64 8l24 10v17q0 20-24 31Q40 55 40 35z" fill="none" stroke="white" stroke-width="5"/><text x="106" y="49" fill="white" font-size="25" font-weight="800">REGRA DO JIU-JITSU</text><text x="386" y="49" fill="white" font-size="19">Conecte antes de colocar os ganchos.</text><text x="681" y="51" fill="#f5c842" font-size="39">★</text></g><text x="380" y="1062" text-anchor="middle" fill="#087aad" font-size="18" font-weight="700">MOVIMENTO COM CONTROLE TRAZ GRANDES RESULTADOS!</text></g></svg>